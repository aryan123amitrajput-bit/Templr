name: Publish SDK 58 Liquid Glass Snack

on:
  push:
    branches:
      - arena/2b2c7bad-templr
    paths:
      - App.js
      - .snack-publish/**
      - .github/workflows/publish-liquid-glass-snack.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .snack-publish/publish.cjs
      - name: Record publishing result
        if: always()
        run: |
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add snack-result.json
          if ! git diff --cached --quiet; then
            git commit -m "Record SDK 58 Snack publishing result"
            git push
          fi
