name: Publish Liquid Glass Snack

on:
  push:
    branches:
      - arena/2b2c7bad-templr
    paths:
      - App.js
      - .snack-publish/**
      - .github/workflows/publish-liquid-glass-snack.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix .snack-publish --no-package-lock --no-audit --no-fund
      - run: node .snack-publish/publish.cjs
